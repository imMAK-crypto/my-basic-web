name: Fetch HeyGen Voice

on:
  push:
    paths:
      - '.github/workflows/fetch-heygen-voice.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download HeyGen WAV
        run: |
          curl -L --fail --retry 3 'https://resource2.heygen.ai/text_to_speech/582810a12d5b4eddbbb7d4800a7aab4f/0516c2d857eb425c94e90b068241914e/id=a9a5f432-3c21-48d1-8ae5-a7f37ef642d4.wav' -o heygen_voice.wav
          file heygen_voice.wav
          test -s heygen_voice.wav
      - name: Upload voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: xplico-heygen-voice
          path: heygen_voice.wav
          retention-days: 1
